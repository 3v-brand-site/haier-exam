services:
  - type: web
    name: haier-exam
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: haier-exam-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: QUESTIONS_JSON_B64
        sync: false

databases:
  - name: haier-exam-db
    plan: free
    region: singapore
